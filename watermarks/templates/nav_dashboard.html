{% block nav_dashboard %}
    <nav
        class="hidden md:flex flex-col h-screen p-stack-md sticky top-0 w-64 bg-surface-container-low border-r border-outline-variant shrink-0">
        <div class="mb-stack-lg flex items-center gap-3">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-primary text-[24px]">water_drop</span>
            
                <h1 class="text-headline-md font-headline-md text-primary tracking-tight">UnMark</h1>
            </div>
        </div>
        <div class="flex flex-col gap-2 flex-grow">
            <!-- Active Tab: Dashboard -->
            <a class="{% if active == 'dashboard' %}flex items-center gap-3 px-4 py-3 bg-primary-container text-on-primary-container rounded-lg font-bold transition-transform scale-95{% else %}flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant rounded-lg transition-all hover:bg-surface-container-high opacity-80 duration-150{% endif %}"
                href="{% url 'dashboard_reload' %}">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dashboard</span>
                <span class="text-label-md font-label-md">Dashboard</span>
            </a>
            <!-- Active Tab: Tools -->
            <a class="{% if active == 'tools' %}flex items-center gap-3 px-4 py-3 bg-primary-container text-on-primary-container rounded-lg font-bold transition-transform scale-95{% else %} flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant rounded-lg transition-all hover:bg-surface-container-high opacity-80 duration-150{% endif %}"
                href="{% url 'tools' %}">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">edit_square</span>
                <span class="text-label-md font-label-md">Tools</span>
            </a>
            <!-- Active Tab: Library -->
            <a class="{% if active == 'library' %}flex items-center gap-3 px-4 py-3 bg-primary-container text-on-primary-container rounded-lg font-bold transition-transform scale-95{% else %} flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant rounded-lg transition-all hover:bg-surface-container-high opacity-80 duration-150{% endif %}"
                href="{% url 'library' %}">
                <span class="material-symbols-outlined">photo_library</span>
                <span class="text-label-md font-label-md">Library</span>
            </a>
            <!-- Active Tab: Account -->
            <a class="{% if active == 'account' %}flex items-center gap-3 px-4 py-3 bg-primary-container text-on-primary-container rounded-lg font-bold transition-transform scale-95{% else %}flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant rounded-lg transition-all hover:bg-surface-container-high opacity-80 duration-150{% endif %}"
                href="{% url 'account' %}">
                <span class="material-symbols-outlined">person</span>
                <span class="text-label-md font-label-md">Account</span>
            </a>
            <!-- Active Tab: Subscription -->
            <a class="{% if active == 'subscription' %}flex items-center gap-3 px-4 py-3 bg-primary-container text-on-primary-container rounded-lg font-bold transition-transform scale-95{% else %}flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant rounded-lg transition-all hover:bg-surface-container-high opacity-80 duration-150{% endif %}"
                href="{% url 'subscription' %}">
                <span class="material-symbols-outlined">workspace_premium</span>
                <span class="text-label-md font-label-md">Subscription</span>
            </a>
        </div>
        <div class="mt-auto flex flex-col gap-2 pt-stack-md border-t border-outline-variant">
            <div class="relative group px-4 py-3">
                <button
                    class="flex items-center gap-3 w-full text-on-surface-variant hover:bg-surface-variant rounded-lg transition-all hover:bg-surface-container-high opacity-80 duration-150">
                    <span class="material-symbols-outlined">language</span>
                    <span class="text-label-md font-label-md flex-1 text-left">Español</span>
                    <span class="material-symbols-outlined text-[18px]">expand_more</span>
                </button>
                <!-- Subtle Dropdown Menu -->
                <div
                    class="absolute bottom-full left-4 mb-2 w-48 bg-surface-container-lowest border border-outline-variant/30 rounded-lg shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-20 overflow-hidden">
                    <a href="#"
                        class="block px-4 py-2 text-label-md text-on-surface hover:bg-surface-variant transition-colors">Català</a>
                    <a href="#"
                        class="block px-4 py-2 text-label-md text-on-surface hover:bg-surface-variant transition-colors font-bold bg-primary-container/10">Español</a>
                    <a href="#"
                        class="block px-4 py-2 text-label-md text-on-surface hover:bg-surface-variant transition-colors">English</a>
                </div>
            </div>
            <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant rounded-lg transition-all hover:bg-surface-container-high opacity-80 duration-150"
                href="#">
                <span class="material-symbols-outlined">settings</span>
                <span class="text-label-md font-label-md">Settings</span>
            </a>
            <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant rounded-lg transition-all hover:bg-surface-container-high opacity-80 duration-150"
                href="#">
                <span class="material-symbols-outlined">help_outline</span>
                <span class="text-label-md font-label-md">Help</span>
            </a>
            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}

                <button
                    type="submit"
                    class="flex w-full items-center gap-3 rounded-lg px-4 py-2
                        text-sm font-medium text-red-600 transition
                        hover:bg-red-50 focus:outline-none
                        focus:ring-2 focus:ring-red-500"
                >
                    <svg
                        class="h-5 w-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M17 16l4-4m0 0-4-4m4 4H7
                            m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7
                            a2 2 0 012-2h6a2 2 0 012 2v1"
                        />
                    </svg>

                    Cerrar sesión
                </button>
            </form>
        </div>
    </nav>
{% endblock %}
