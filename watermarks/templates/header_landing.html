<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <nav class="bg-surface dark:bg-on-background shadow-sm sticky top-0 w-full z-50">
        <div class="flex justify-between items-center px-margin-desktop py-4 w-full max-w-container-max mx-auto">
            <a href="{% url 'landing_page' %}">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary text-[32px]">water_drop</span>
                    <span
                        class="text-headline-md font-headline-lg text-primary dark:text-primary-fixed tracking-tight">UnMark</span>
                </div>
            </a>
            <div class="hidden md:flex gap-gutter items-center">
                <a class="text-on-surface-variant dark:text-outline-variant font-medium text-body-md font-body-md hover:text-primary dark:hover:text-primary-fixed-dim transition-colors"
                    href="#">Pricing</a>
                <a class="text-on-surface-variant dark:text-outline-variant font-medium text-body-md font-body-md hover:text-primary dark:hover:text-primary-fixed-dim transition-colors"
                    href="#">Features</a>
                <a class="text-on-surface-variant dark:text-outline-variant font-medium text-body-md font-body-md hover:text-primary dark:hover:text-primary-fixed-dim transition-colors"
                    href="#">Support</a>
            </div>
            <div class="flex items-center gap-stack-md">
                <div class="relative group">
                    <button
                        class="flex items-center gap-1 text-on-surface-variant dark:text-outline-variant font-medium text-label-md hover:text-primary transition-colors py-2 px-2 rounded-lg hover:bg-surface-container">
                        <span class="material-symbols-outlined text-[20px]">language</span>
                        <span class="hidden lg:block">Español</span>
                        <span class="material-symbols-outlined text-[16px]">expand_more</span>
                    </button>
                    <div
                        class="absolute right-0 mt-1 w-40 bg-surface-container-lowest border border-outline-variant rounded-xl shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50 overflow-hidden">
                        <a href="#"
                            class="block px-4 py-2 text-label-md text-on-surface hover:bg-surface-container transition-colors">Català</a>
                        <a href="#"
                            class="block px-4 py-2 text-label-md text-on-surface hover:bg-surface-container transition-colors">English</a>
                        <a href="#"
                            class="block px-4 py-2 text-label-md text-primary bg-surface-container font-semibold">Español</a>
                    </div>
                </div>
                {% if user.is_authenticated %}
                <a href="{% url 'logout' %}"
                    class="bg-primary text-on-primary px-4 py-3 rounded-lg font-label-md text-label-md hover:bg-primary-container transition-colors shadow-sm">Logout</a>
                {% else %}
                <a href="{% url 'login' %}"
                    class="hidden md:block text-primary dark:text-primary-fixed font-label-md text-label-md hover:text-primary-container transition-colors">Login</a>
                <a href="{% url 'signup' %}"
                    class="bg-primary text-on-primary px-4 py-3 rounded-lg font-label-md text-label-md hover:bg-primary-container transition-colors shadow-sm">Sign
                    up</a>
                {% endif %}
                <!--
                ------------ Avatar -----------------
                <img alt="User Avatar"
                    class="w-10 h-10 rounded-full border border-outline-variant object-cover hidden sm:block"
                    data-alt="A small, circular, minimalist user avatar showing a smiling person in a brightly lit studio. Professional corporate headshot style."
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1SSKwK1MLCqg49tZ8aOB2uN3i62z897jDeoS8RPUE0bzd6f4qrYdwXV-cABgN3ea_kBst21M4iEIn6nBQbXgPJcSM214cMDFXQDDrfaA39u0nBo94nhngodjFfqJcFksPeImvK8N9yrU8ZrzyaTZ8rmzfIc2C09hdJWSFE_9Xlqy8LEsT-SzofuqJgWMx6JWLhpIKyEXJScd_IYyy6yRQ2krCkEXkfQoFzhSBLnXL0c283XT3oI4">
                -->
            </div>
        </div>
    </nav>

</body>

</html>
